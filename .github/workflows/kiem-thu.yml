name: Kiểm thử

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      commit_bak:
        description: "Đưa tệp .bak vào thư mục Database của nhánh đang chạy"
        type: boolean
        default: false

jobs:
  sql:
    name: Kiểm thử SQL Server
    runs-on: ubuntu-latest
    env:
      SA_PASSWORD: Kt@Test2026-Mssql
      SQLCMD: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Kt@Test2026-Mssql -C -b -f 65001
    steps:
      - uses: actions/checkout@v4

      - name: Khởi động SQL Server 2022
        run: |
          docker run -d --name mssql -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$SA_PASSWORD" -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 60); do
            if docker exec mssql $SQLCMD -Q "SELECT 1" >/dev/null 2>&1; then echo "SQL Server sẵn sàng sau $i lần thử"; exit 0; fi
            sleep 2
          done
          docker logs mssql | tail -30
          exit 1

      - name: Chép script vào container
        run: |
          docker cp QuanLyKhachSan/Scripts/01_CreateDatabase.sql mssql:/tmp/01_CreateDatabase.sql
          docker cp QuanLyKhachSan/Scripts/02_InsertSampleData.sql mssql:/tmp/02_InsertSampleData.sql
          docker cp QuanLyKhachSan/Scripts/KiemThu.sql mssql:/tmp/KiemThu.sql

      - name: Chạy 01 và 02 lần 1 (tạo mới)
        run: |
          docker exec mssql $SQLCMD -i /tmp/01_CreateDatabase.sql
          docker exec mssql $SQLCMD -i /tmp/02_InsertSampleData.sql

      - name: Chạy 01 và 02 lần 2 (chạy lại không lỗi)
        run: |
          docker exec mssql $SQLCMD -i /tmp/01_CreateDatabase.sql
          docker exec mssql $SQLCMD -i /tmp/02_InsertSampleData.sql

      - name: Kiểm thử SQL (KiemThu.sql)
        run: docker exec mssql $SQLCMD -W -s " | " -i /tmp/KiemThu.sql

  sao-luu:
    name: Tạo và kiểm tra tệp sao lưu .bak
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SA_PASSWORD: Kt@Test2026-Mssql
      SQLCMD: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Kt@Test2026-Mssql -C -b -f 65001
    steps:
      - uses: actions/checkout@v4

      - name: Khởi động SQL Server 2022
        run: |
          docker run -d --name mssql -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$SA_PASSWORD" -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 60); do
            if docker exec mssql $SQLCMD -Q "SELECT 1" >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs mssql | tail -30
          exit 1

      - name: Tạo database từ hai script rồi sao lưu
        run: |
          docker cp QuanLyKhachSan/Scripts/01_CreateDatabase.sql mssql:/tmp/01.sql
          docker cp QuanLyKhachSan/Scripts/02_InsertSampleData.sql mssql:/tmp/02.sql
          docker cp QuanLyKhachSan/Scripts/KiemThu.sql mssql:/tmp/KiemThu.sql
          docker exec mssql $SQLCMD -i /tmp/01.sql
          docker exec mssql $SQLCMD -i /tmp/02.sql
          docker exec mssql $SQLCMD -Q "BACKUP DATABASE QuanLyKhachSan TO DISK = N'/var/opt/mssql/data/QuanLyKhachSan.bak' WITH INIT, CHECKSUM"

      - name: Khôi phục từ .bak vào database trống rồi chạy kiểm thử SQL
        run: |
          docker exec mssql $SQLCMD -Q "ALTER DATABASE QuanLyKhachSan SET SINGLE_USER WITH ROLLBACK IMMEDIATE; DROP DATABASE QuanLyKhachSan;"
          docker exec mssql $SQLCMD -Q "RESTORE DATABASE QuanLyKhachSan FROM DISK = N'/var/opt/mssql/data/QuanLyKhachSan.bak' WITH CHECKSUM, REPLACE"
          docker exec mssql $SQLCMD -W -s " | " -i /tmp/KiemThu.sql

      - name: Lấy tệp .bak ra khỏi container
        run: |
          mkdir -p Database
          docker cp mssql:/var/opt/mssql/data/QuanLyKhachSan.bak Database/QuanLyKhachSan.bak
          ls -l Database

      - uses: actions/upload-artifact@v4
        with:
          name: QuanLyKhachSan-bak
          path: Database/QuanLyKhachSan.bak

      - name: Đưa tệp .bak vào nhánh (chỉ khi chọn commit_bak)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_bak }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f Database/QuanLyKhachSan.bak
          git commit -m "chore: cập nhật tệp sao lưu QuanLyKhachSan.bak"
          git push origin HEAD:${{ github.ref_name }}

  build:
    name: Build và kiểm thử logic (.NET)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build toàn bộ solution
        run: dotnet build QuanLyKhachSan.sln -c Release

      - name: Chạy bộ kiểm thử logic
        run: dotnet run --project QuanLyKhachSan.Tests -c Release --no-build
